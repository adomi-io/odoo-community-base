# Rebuild this image when the upstream Odoo image changes
name: Rebuild on upstream image change

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  packages: read

env:
  UPSTREAM_IMAGE: ghcr.io/adomi-io/odoo:19.0
  BUILT_IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build stamps the base digest it used on the published image, so there is
      # no state to write back here (the workflow token cannot set repository variables)
      - name: Compare the upstream digest with the one the last build used
        id: digest
        run: |
          CURRENT_DIGEST=$(docker buildx imagetools inspect "$UPSTREAM_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')

          # Empty when nothing was published yet or the last build predates the label
          KNOWN_DIGEST=$(docker buildx imagetools inspect "$BUILT_IMAGE" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '[.. | objects | select(has("config")) | .config.Labels["org.opencontainers.image.base.digest"] // empty] | first // empty' \
            || true)

          echo "Upstream: $CURRENT_DIGEST"
          echo "Built:    ${KNOWN_DIGEST:-none}"

          if [ "$CURRENT_DIGEST" = "$KNOWN_DIGEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start the image build
        if: steps.digest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run docker-publish.yml \
            --repo "$REPO" \
            --ref master
